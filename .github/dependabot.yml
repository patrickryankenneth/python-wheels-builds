# The previous file was GitHub's unfilled template (package-ecosystem: ""), which
# does nothing. Weekly PRs for the pinned things that otherwise go stale.
version: 2
updates:
  # SHA-pinned actions: Dependabot bumps the SHA and the "# vX.Y.Z" comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # maturin (hash-pinned). Verify the first PR keeps the --hash lines intact.
  - package-ecosystem: "pip"
    directory: "/environments/alpine-3.24-musl"
    schedule:
      interval: "weekly"