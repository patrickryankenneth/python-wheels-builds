name: _verify-and-release

# Shared release module. Called via `uses:` from any build workflow's
# `release:` job. This file is the thing whose hardening level gets
# versioned - bump POLICY_VERSION below as verification gets more
# complex, and every caller picks it up automatically just by pointing at
# a newer commit SHA of this file, without changing anything of their own.

on:
  workflow_call:
    inputs:
      tag:
        description: "Explicit release tag override (e.g. smoke-<run_id>). Leave empty: derived from the wheels' version, with .postN appended only when a release for that version already exists"
        required: false
        default: ""
        type: string
      upstream_sha:
        required: true
        type: string
      upstream_tag:
        description: "Upstream git tag that resolved to upstream_sha (e.g. v2.0.5). Only used for release notes; distinct from the release's own tag"
        required: false
        default: ""
        type: string
      wheel_artifact_name:
        required: true
        type: string
      source_archive_artifact_name:
        required: true
        type: string
      signer_workflow:
        description: "[host/]<owner>/<repo>/<path>/<to>/<workflow> of the calling build workflow"
        required: true
        type: string
      release_title_prefix:
        default: "dbt-oss"
        type: string
      upstream_predicate:
        default: "https://patrickryankenneth.github.io/attestations/upstream-source/v1"
        type: string
      force_new_post:
        description: "If true, publish under the next free .postN even when a published release already has these exact wheel names (e.g. re-released with stronger attestations)"
        default: false
        type: boolean
      dry_run:
        description: "If true, verify everything end-to-end then delete the draft instead of publishing"
        default: false
        type: boolean
      draft_only:
        description: "If true (default), verify then leave the release as an unpublished draft; the maintainer signs SHA256SUMS and publishes. Set false only to publish from CI."
        default: true
        type: boolean
    outputs:
      release_url:
        description: "URL of the published release (empty in dry-run mode)"
        value: ${{ jobs.release.outputs.release_url }}
      release_tag:
        description: "Tag the release was (or would have been, in dry-run) published under"
        value: ${{ jobs.release.outputs.release_tag }}

env:
  POLICY_VERSION: 2026-09-sha-pinned-v1
  # Pinned here so the release cannot vouch for itself; policy-ci fails if these drift from policy.json.
  POLICY_TAG: policy-wheel-build-v1.3
  POLICY_SHA256: ef1ccc65a0a6cecece5b36b784fb462cd205f077271038d51a48fd57fa10e9b4

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
      actions: read
    outputs:
      release_url: ${{ steps.run.outputs.release_url }}
      release_tag: ${{ steps.run.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only need release_manager.py out of the whole repo - sparse
      # checkout keeps this fast and means a change anywhere else in the
      # repo can't accidentally affect what this job checks out.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Download wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ inputs.wheel_artifact_name }}
          merge-multiple: true
          path: dist

      - name: Download source archive artifact into release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ inputs.source_archive_artifact_name }}
          merge-multiple: true
          path: release-assets

      - name: Fetch published wheel-build policy
        run: |
          set -euo pipefail
          gh release download "$POLICY_TAG" --repo "${{ github.repository }}" --dir policy-published \
            --pattern policy.json --pattern policy.json.sha256
          (cd policy-published && sha256sum -c policy.json.sha256)
          echo "${POLICY_SHA256}  policy-published/policy.json" | sha256sum -c -

      - name: Run release manager
        id: run
        run: |
          python3 .github/scripts/release_manager.py \
            --repo "${{ github.repository }}" \
            --sha "${{ inputs.upstream_sha }}" \
            ${{ inputs.upstream_tag && format('--upstream-tag {0}', inputs.upstream_tag) || '' }} \
            --signer-workflow "${{ inputs.signer_workflow }}" \
            --upstream-predicate "${{ inputs.upstream_predicate }}" \
            --release-title-prefix "${{ inputs.release_title_prefix }}" \
            ${{ inputs.tag && format('--tag {0}', inputs.tag) || '' }} \
            ${{ inputs.force_new_post && '--force-new-post' || '' }} \
            --verify-cmd "python3 .github/scripts/verify_wheel_policy.py --policy policy-published/policy.json --root . --wheel-dir dist --assets-dir release-assets --lock builder.lock --repo ${{ github.repository }} --signer-workflow ${{ inputs.signer_workflow }} --source-ref ${{ github.ref }} --build-sha ${{ github.sha }} --upstream-tag ${{ inputs.upstream_tag }} --release-tag {release_tag}" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.draft_only && '--draft-only' || '' }}
