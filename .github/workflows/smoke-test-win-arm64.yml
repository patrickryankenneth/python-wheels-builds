name: smoke-test-win-arm64

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke-test-win-arm64.yml'

jobs:
  probe:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: System info
        shell: pwsh
        run: |
          [System.Environment]::OSVersion
          $env:PROCESSOR_ARCHITECTURE

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # sccache: GitHub-Actions-native compile cache. No S3/credentials needed -
      # it stores compiled object cache in GitHub's own Actions cache backend
      # (same storage actions/cache uses), keyed automatically by toolchain +
      # source hash. Free, ~10GB/repo, evicted after 7 days unused.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Set sccache env vars
        shell: pwsh
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
          # Optional but worth it for iterative dev: incremental compilation.
          # Skip this for final release wheel builds - incremental adds overhead
          # to a from-scratch CI build and produces slightly larger artifacts.
          # echo "CARGO_INCREMENTAL=1" >> $env:GITHUB_ENV

      - name: Rust toolchain info
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version

      - name: Python info
        shell: pwsh
        run: |
          python --version
          python -c "import platform; print(platform.machine(), platform.architecture())"

      # rlib probe (proves basic compiler/linker toolchain works)
      - name: Probe rlib build
        shell: pwsh
        run: |
          cargo new --lib probe-rlib
          cd probe-rlib
          cargo build --release
          Get-ChildItem target\release

      # cdylib probe (proves the ACTUAL artifact type a Python wheel needs -
      # this is what exercises link.exe / the MSVC linker for real, unlike rlib)
      - name: Probe cdylib build
        shell: pwsh
        run: |
          cargo new --lib probe-cdylib
          cd probe-cdylib
          Add-Content -Path Cargo.toml -Value "`n[lib]`ncrate-type = [`"cdylib`"]"
          cargo build --release
          Get-ChildItem target\release

      - name: sccache stats
        shell: pwsh
        run: sccache --show-stats