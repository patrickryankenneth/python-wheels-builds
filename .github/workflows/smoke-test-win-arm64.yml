name: smoke-test-win-arm64

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke-test-win-arm64.yml'

jobs:
  probe:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: System info
        shell: pwsh
        run: |
          [System.Environment]::OSVersion
          $env:PROCESSOR_ARCHITECTURE

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      # Resilience: sccache's GHA cache backend can have transient outages
      # (seen: "Our services aren't available right now" / HTTP 400 from
      # artifactcache.actions.githubusercontent.com). By default sccache fails
      # HARD on this - it kills every single rustc invocation, not just cache
      # misses. So: probe it first. If the cache backend is unhappy, fall back
      # to building with NO cache rather than failing the whole job. A slow
      # build beats a broken one.
      - name: Enable sccache (with fallback if cache backend is unhealthy)
        shell: pwsh
        run: |
          $env:SCCACHE_GHA_ENABLED = "true"
          & sccache --start-server
          if ($LASTEXITCODE -eq 0) {
            Write-Host "sccache server started OK - enabling cache"
            echo "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
            echo "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          } else {
            Write-Warning "sccache server failed to start (cache backend likely down) - continuing WITHOUT cache for this run"
            & sccache --stop-server 2>$null
          }

      - name: Rust toolchain info
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version

      - name: Python info
        shell: pwsh
        run: |
          python --version
          python -c "import platform; print(platform.machine(), platform.architecture())"

      - name: Probe rlib build
        shell: pwsh
        run: |
          cargo new --lib probe-rlib
          cd probe-rlib
          cargo build --release
          Get-ChildItem target\release

      - name: Probe cdylib build
        shell: pwsh
        run: |
          cargo new --lib probe-cdylib
          cd probe-cdylib
          Add-Content -Path Cargo.toml -Value "`n[lib]`ncrate-type = [`"cdylib`"]"
          cargo build --release
          Get-ChildItem target\release

      - name: sccache stats (if it was enabled)
        if: env.RUSTC_WRAPPER == 'sccache'
        shell: pwsh
        run: sccache --show-stats
