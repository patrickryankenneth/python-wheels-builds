name: smoke-test-win-arm64

on:
  workflow_dispatch:   # manual trigger only for now - no point running this on every push yet
  push:
    paths:
      - '.github/workflows/smoke-test-win-arm64.yml'

jobs:
  probe:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: System info
        shell: pwsh
        run: |
          Write-Host "=== OS / arch ==="
          [System.Environment]::OSVersion
          $env:PROCESSOR_ARCHITECTURE
          Write-Host "=== VS install (if any) ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Depth 1 -ErrorAction SilentlyContinue

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust toolchain info
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version
          rustup show

      - name: Python info
        shell: pwsh
        run: |
          python --version
          python -c "import platform; print(platform.machine(), platform.architecture())"

      - name: Try a trivial cargo build (sanity check the C toolchain link step works)
        shell: pwsh
        run: |
          cargo new --lib probe-crate
          cd probe-crate
          cargo build --release
          Get-ChildItem target\release
