name: build-dbt-oss-musllinux

on:
  workflow_dispatch:
    inputs:
      dbt_oss_tag:
        description: "Upstream dbt-oss git tag to build from"
        required: true
        default: "v2.0.5"
      package_targets:
        description: "dbt-core, dbt-oss, or both"
        required: true
        default: "both"
      cold_cache:
        description: "Allow network / lockfile updates (first run after a cache reset)"
        required: true
        default: "0"
      force_new_post:
        description: "Publish as the next .postN even if a release with these exact wheel names exists (use after hardening attestations)"
        type: boolean
        default: false
      dry_run:
        description: "Verify the whole release end-to-end, then delete the draft instead of publishing. Leave OFF to publish for real."
        type: boolean
        default: false

# packages: read is belt-and-suspenders: the image is public so pulling
# doesn't strictly require it, but a newly-published package on GHCR
# defaults to private, so logging in keeps this workflow working even if
# a future image/tag under this repo gets created private again.
# id-token/attestations: write are needed by the build job's attest steps.
permissions:
  contents: read
  packages: read
  id-token: write
  attestations: write

env:
  UPSTREAM_PREDICATE: https://patrickryankenneth.github.io/attestations/upstream-source/v1
  # Bump this whenever the checkout/build workflow's own hardening level
  # changes. Recorded inside upstream-source.json by checkout_verify.py,
  # so it's signed as part of the attestation - not just a label here.
  # Kept identical to build-dbt-oss-win-arm64.yml's value since both
  # platforms build the same upstream commit under the same policy today.
  POLICY_VERSION: 2026-09-sha-pinned-v1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_OSS_TAG: ${{ inputs.dbt_oss_tag || 'v2.0.5' }}
      PACKAGE_TARGETS: ${{ inputs.package_targets || 'both' }}
      COLD_CACHE: ${{ inputs.cold_cache || '0' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/pywheels-alpine-builder
    outputs:
      tag: ${{ env.DBT_OSS_TAG }}
      upstream_sha: ${{ steps.checkout_verify.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo + sccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/pywheels-cache/cargo-registry
            ~/pywheels-cache/cargo-git
            ~/pywheels-cache/cargo-target
            ~/pywheels-cache/sccache
          key: >-
            pywheels-musllinux-
            ${{ hashFiles('environments/alpine-3.20-musl/Containerfile') }}-
            ${{ env.DBT_OSS_TAG }}
          restore-keys: |
            pywheels-musllinux-${{ hashFiles('environments/alpine-3.20-musl/Containerfile') }}-
            pywheels-musllinux-

      - name: Prepare cache dirs
        run: |
          mkdir -p ~/pywheels-cache/cargo-registry \
                   ~/pywheels-cache/cargo-git \
                   ~/pywheels-cache/cargo-target \
                   ~/pywheels-cache/sccache \
                   "${{ github.workspace }}/recipes/dbt-oss/dist"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull builder image
        run: |
          docker pull "${IMAGE}:${{ hashFiles('environments/alpine-3.20-musl/Containerfile') }}" \
            || docker pull "${IMAGE}:latest"
          docker tag "${IMAGE}:${{ hashFiles('environments/alpine-3.20-musl/Containerfile') }}" pywheels-alpine-builder \
            || docker tag "${IMAGE}:latest" pywheels-alpine-builder

      # No --user here on purpose: RUSTUP_HOME=/opt/rustup and
      # CARGO_HOME=/opt/cargo are baked into the image as root-owned
      # during the Containerfile build (rustup/cargo installed as root).
      # Forcing the container to run as the host UID breaks its ability
      # to write its own temp files there ("Permission denied" creating
      # /opt/rustup/tmp/... - what just happened). Root inside the
      # container is fine and expected; the problem was only ever about
      # what gets left behind on the *host* side of the bind mounts.
      #
      # .github/scripts is bind-mounted read-only so build.sh can call
      # checkout_verify.py without that script needing to live inside
      # the image itself - keeps the image reusable across script changes.
      - name: Run build.sh in container
        run: |
          docker run --rm \
            -e RUSTFLAGS="--cap-lints=warn" \
            -e CARGO_LOG="cargo::core::compiler::fingerprint=info" \
            -e DBT_OSS_TAG="${DBT_OSS_TAG}" \
            -e PACKAGE_TARGETS="${PACKAGE_TARGETS}" \
            -e COLD_CACHE="${COLD_CACHE}" \
            -e POLICY_VERSION="${{ env.POLICY_VERSION }}" \
            -v ~/pywheels-cache/cargo-registry:/opt/cargo/registry \
            -v ~/pywheels-cache/cargo-git:/opt/cargo/git \
            -v ~/pywheels-cache/cargo-target:/cargo-target \
            -v ~/pywheels-cache/sccache:/sccache \
            -v "${{ github.workspace }}/recipes/dbt-oss:/build" \
            -v "${{ github.workspace }}/.github/scripts:/scripts:ro" \
            pywheels-alpine-builder \
            sh /build/build.sh

      # build.sh (via checkout_verify.py) wrote plain KEY=VALUE lines to
      # this file under the bind-mounted /build dir, which is why it's
      # readable from the host here without reaching back into the
      # container. Only runs if the previous step succeeded, so a build
      # that failed never produces outputs for the release job to consume.
      - name: Surface checkout-verify outputs
        id: checkout_verify
        run: cat "recipes/dbt-oss/checkout-verify-outputs.env" >> "$GITHUB_OUTPUT"

      # This is the actual fix for the original bug. The container above
      # ran as root, so everything it wrote into the four bind-mounted
      # host dirs is root-owned. This spins up one more container - also
      # as root, deliberately - whose only job is chown, so the *host*
      # copies of those paths end up owned by the runner user that the
      # later actions/cache save step runs as. Runs even if the build
      # step failed, so a failed build doesn't also throw away whatever
      # cache progress it made (e.g. registry/index fetches) on top of
      # the actual failure.
      - name: Fix cache dir ownership for cache save
        if: always()
        run: |
          docker run --rm \
            -v ~/pywheels-cache/cargo-registry:/opt/cargo/registry \
            -v ~/pywheels-cache/cargo-git:/opt/cargo/git \
            -v ~/pywheels-cache/cargo-target:/cargo-target \
            -v ~/pywheels-cache/sccache:/sccache \
            pywheels-alpine-builder \
            chown -R "$(id -u):$(id -g)" /opt/cargo/registry /opt/cargo/git /cargo-target /sccache

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbt-wheels-musllinux-${{ env.DBT_OSS_TAG }}
          path: recipes/dbt-oss/dist/**/*.whl
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbt-source-archive-musllinux-${{ env.DBT_OSS_TAG }}
          path: recipes/dbt-oss/source-archive/*.tar.gz
          if-no-files-found: error

      - name: Upload build logs (fingerprint + sccache diagnostics)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-logs-${{ env.DBT_OSS_TAG }}
          path: recipes/dbt-oss/build-logs/*.log
          if-no-files-found: ignore

      - name: Upload cargo timing report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cargo-timings-${{ env.DBT_OSS_TAG }}
          path: ~/pywheels-cache/cargo-target/cargo-timings/*.html
          if-no-files-found: ignore

      # Each dist/<name>/ folder holds exactly one wheel, so these are
      # attested individually - one single-subject attestation per wheel,
      # instead of one glob covering both (which GitHub Actions treats as
      # a single multi-subject attestation, not two separate ones).
      # Mirrors build-dbt-oss-win-arm64.yml's attest steps; paths are
      # prefixed with recipes/dbt-oss/ here since that's where the bind
      # mount puts dist/ and upstream-source.json, unlike win-arm64 where
      # the upstream repo is checked out directly at the workspace root.
      - name: Attest build provenance (dbt-core)
        if: hashFiles('recipes/dbt-oss/dist/dbt-core/*.whl') != ''
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: recipes/dbt-oss/dist/dbt-core/*.whl

      - name: Attest upstream source (dbt-core)
        if: hashFiles('recipes/dbt-oss/dist/dbt-core/*.whl') != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: recipes/dbt-oss/dist/dbt-core/*.whl
          predicate-type: ${{ env.UPSTREAM_PREDICATE }}
          predicate-path: recipes/dbt-oss/upstream-source.json

      - name: Attest build provenance (dbt-oss)
        if: hashFiles('recipes/dbt-oss/dist/dbt-oss/*.whl') != ''
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: recipes/dbt-oss/dist/dbt-oss/*.whl

      - name: Attest upstream source (dbt-oss)
        if: hashFiles('recipes/dbt-oss/dist/dbt-oss/*.whl') != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: recipes/dbt-oss/dist/dbt-oss/*.whl
          predicate-type: ${{ env.UPSTREAM_PREDICATE }}
          predicate-path: recipes/dbt-oss/upstream-source.json

  # Only runs for a deliberate workflow_dispatch run, not the push-trigger
  # smoke rebuilds above (Containerfile/build.sh/script changes) - those
  # shouldn't silently attempt a release.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/verify-and-release.yml
    permissions:
      contents: write
      attestations: read
      actions: read
    with:
      upstream_sha: ${{ needs.build.outputs.upstream_sha }}
      upstream_tag: ${{ needs.build.outputs.tag }}
      wheel_artifact_name: dbt-wheels-musllinux-${{ needs.build.outputs.tag }}
      source_archive_artifact_name: dbt-source-archive-musllinux-${{ needs.build.outputs.tag }}
      signer_workflow: ${{ github.repository }}/.github/workflows/build-dbt-oss-musllinux.yml
      dry_run: ${{ inputs.dry_run }}
      force_new_post: ${{ inputs.force_new_post || false }}
