name: build-dbt-oss-musllinux

on:
  workflow_dispatch:
    inputs:
      dbt_oss_tag:
        description: "dbt-oss tag to build"
        required: true
        default: "v2.0.5"
      package_targets:
        description: "dbt-core, dbt-oss, or both"
        required: true
        default: "both"
      cold_cache:
        description: "Allow network / lockfile updates (first run after a cache reset)"
        required: true
        default: "0"
  push:
    paths:
      - "environments/alpine-3.20-musl/Containerfile"
      - "recipes/dbt-oss/build.sh"
      - ".github/workflows/build-dbt-oss-musllinux.yml"

# packages: read is required to pull the (private-by-default) GHCR image -
# without it, `docker pull` on a private package returns "denied" even
# with a correct tag, because an unauthenticated pull never even attempts
# to use the token.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_OSS_TAG: ${{ inputs.dbt_oss_tag || 'v2.0.5' }}
      PACKAGE_TARGETS: ${{ inputs.package_targets || 'both' }}
      COLD_CACHE: ${{ inputs.cold_cache || '0' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/pywheels-alpine-builder
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo + sccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/pywheels-cache/cargo-registry
            ~/pywheels-cache/cargo-git
            ~/pywheels-cache/cargo-target
            ~/pywheels-cache/sccache
          key: >-
            pywheels-musllinux-
            ${{ hashFiles('environments/alpine-3.20-musl/Containerfile') }}-
            ${{ env.DBT_OSS_TAG }}
          restore-keys: |
            pywheels-musllinux-${{ hashFiles('environments/alpine-3.20-musl/Containerfile') }}-
            pywheels-musllinux-

      - name: Prepare cache dirs
        run: |
          mkdir -p ~/pywheels-cache/cargo-registry \
                   ~/pywheels-cache/cargo-git \
                   ~/pywheels-cache/cargo-target \
                   ~/pywheels-cache/sccache \
                   "${{ github.workspace }}/recipes/dbt-oss/dist"

      # Was missing entirely before - this is why the pull below was
      # returning "denied" on both the hash tag and :latest. Same login
      # build-environment-image.yml already does before its push.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull builder image
        run: |
          docker pull "${IMAGE}:${{ hashFiles('environments/alpine-3.20-musl/Containerfile') }}" \
            || docker pull "${IMAGE}:latest"
          docker tag "${IMAGE}:${{ hashFiles('environments/alpine-3.20-musl/Containerfile') }}" pywheels-alpine-builder \
            || docker tag "${IMAGE}:latest" pywheels-alpine-builder

      # --user pins the container's UID/GID to the host runner user, so
      # everything it writes into the bind-mounted cache dirs is owned by
      # that same user. Without this, the container's default root user
      # owns those files, and the later `actions/cache` save step (which
      # runs as the unprivileged runner user) gets Permission denied on
      # every one of them - the save silently fails and nothing persists.
      - name: Run build.sh in container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e RUSTFLAGS="--cap-lints=warn" \
            -e DBT_OSS_TAG="${DBT_OSS_TAG}" \
            -e PACKAGE_TARGETS="${PACKAGE_TARGETS}" \
            -e COLD_CACHE="${COLD_CACHE}" \
            -e HOME=/tmp \
            -v ~/pywheels-cache/cargo-registry:/opt/cargo/registry \
            -v ~/pywheels-cache/cargo-git:/opt/cargo/git \
            -v ~/pywheels-cache/cargo-target:/cargo-target \
            -v ~/pywheels-cache/sccache:/sccache \
            -v "${{ github.workspace }}/recipes/dbt-oss:/build" \
            pywheels-alpine-builder \
            sh /build/build.sh

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbt-wheels-musllinux-${{ env.DBT_OSS_TAG }}
          path: recipes/dbt-oss/dist/**/*.whl
          if-no-files-found: error

      - name: Upload cargo timing report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cargo-timings-${{ env.DBT_OSS_TAG }}
          path: ~/pywheels-cache/cargo-target/cargo-timings/*.html
          if-no-files-found: ignore
