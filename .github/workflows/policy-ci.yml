name: policy-ci

on:
  pull_request:
    paths:
      - "policy/**"
      - ".github/scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Lint wheel-build policy and POLICY.md
        run: |
          P="--policy policy/wheel-build/policy.json --md policy/wheel-build/POLICY.md --verifier .github/scripts/verify_wheel_policy.py"
          python3 .github/scripts/policy_tool_v2.py $P lint
          python3 .github/scripts/policy_tool_v2.py $P check-md

      - name: Test verifier
        run: python3 -m pytest tests/test_verify_wheel_policy.py -q
