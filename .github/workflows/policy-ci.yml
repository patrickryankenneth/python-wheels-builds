name: policy-ci

on:
  pull_request:
    paths:
      - "policy/**"
      - ".github/scripts/**"
      - ".github/workflows/verify-and-release.yml"
      - "tests/**"
  # push is deliberately unfiltered: release-policy requires a green run on the exact main commit
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Lint wheel-build policy and POLICY.md
        run: |
          P="--policy policy/wheel-build/policy.json --md policy/wheel-build/POLICY.md --verifier .github/scripts/verify_wheel_policy.py"
          python3 .github/scripts/policy_tool_v2.py $P lint
          python3 .github/scripts/policy_tool_v2.py $P check-md

      - name: verify-and-release.yml pins match policy.json
        run: |
          set -euo pipefail
          P="--policy policy/wheel-build/policy.json --md policy/wheel-build/POLICY.md --verifier .github/scripts/verify_wheel_policy.py"
          F=.github/workflows/verify-and-release.yml
          want_sha="$(grep -oP '^\s*POLICY_SHA256:\s*\K[0-9a-f]{64}' "$F")"
          have_sha="$(sha256sum policy/wheel-build/policy.json | cut -d' ' -f1)"
          want_tag="$(grep -oP '^\s*POLICY_TAG:\s*\K\S+' "$F")"
          have_tag="$(python3 .github/scripts/policy_tool_v2.py $P tag)"
          [ "$want_sha" = "$have_sha" ] || { echo "::error::POLICY_SHA256 $want_sha != policy.json $have_sha"; exit 1; }
          [ "$want_tag" = "$have_tag" ] || { echo "::error::POLICY_TAG $want_tag != $have_tag"; exit 1; }

      - name: Tests
        run: python3 -m pytest tests -q
