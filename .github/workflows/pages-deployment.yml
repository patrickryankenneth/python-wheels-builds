name: Deploy README to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # Allows manual trigger from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs to prevent incomplete deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Convert README.md to HTML
        run: |
          pip install markdown
          python3 - << 'EOF'
          import os
          import markdown

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # Convert markdown to html with support for tables and code blocks
          body = markdown.markdown(content, extensions=["tables", "fenced_code", "toc"])

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>python-wheels-builds</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">
            <style>
              body {{
                box-sizing: border-box;
                min-width: 200px;
                max-width: 980px;
                margin: 0 auto;
                padding: 45px;
              }}
              @media (max-width: 767px) {{
                body {{
                  padding: 15px;
                }}
              }}
            </style>
          </head>
          <body class="markdown-body">
          {body}
          </body>
          </html>
          """

          os.makedirs("_site", exist_ok=True)
          with open("_site/index.html", "w", encoding="utf-8") as out:
              out.write(html)
          EOF

          # Tell GitHub Pages not to run Jekyll
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
