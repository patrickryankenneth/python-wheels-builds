name: build-dbt-oss-win-arm64

on:
  workflow_dispatch:
    inputs:
      dbt_oss_tag:
        description: 'Git tag in dbt-labs/dbt-oss to build (e.g. v2.0.5)'
        required: true
        default: 'v2.0.5'
      package_targets:
        description: 'Which distribution name(s) to build and publish'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - dbt-core
          - dbt-oss

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  UPSTREAM_PREDICATE: https://patrickryankenneth.github.io/attestations/upstream-source/v1
  # Bump this whenever the workflow's own hardening level changes (SHA-pinning,
  # multi-cloud quorum, etc). Recorded inside upstream-source.json, so it's
  # signed as part of the attestation - not just a label in this file.
  POLICY_VERSION: 2026-09-sha-pinned-v1

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 360
    env:
      RUSTFLAGS: "--cap-lints=warn"
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}
    steps:
      - name: Resolve upstream tag to commit
        id: upstream
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.dbt_oss_tag }}
        run: |
          $url = "https://github.com/dbt-labs/dbt-oss.git"
          $tag = $env:TAG
          $line = git ls-remote $url "refs/tags/${tag}^{}"
          if (-not $line) { $line = git ls-remote $url "refs/tags/${tag}" }
          if (-not $line) { throw "Tag $tag not found in $url" }
          $sha = ($line | Select-Object -First 1).Split("`t")[0]
          echo "Tag $tag resolves to $sha"
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Checkout dbt-oss at resolved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dbt-labs/dbt-oss
          ref: ${{ steps.upstream.outputs.sha }}
          path: dbt-oss

      - name: Verify checkout is exact and unmodified
        shell: pwsh
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          $head = git -C dbt-oss rev-parse HEAD
          if ($head -ne $env:SHA) { throw "HEAD $head != expected $env:SHA" }
          if (git -C dbt-oss status --porcelain) { throw "Working tree is not clean" }
          echo "Checkout verified: $head"

      # Content-addressed snapshot of the exact verified tree, taken before
      # the ~30min build so a failure here surfaces in seconds. This is what
      # makes the attestation independently re-checkable even if upstream
      # later force-pushes, deletes the tag, renames the repo, or the whole
      # thing goes away: the archive (and its digest, recorded below) is our
      # own durable copy, not a pointer back into upstream's repo.
      - name: Create source archive and compute digest
        id: archive
        shell: pwsh
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path source-archive | Out-Null
          $archiveName = "dbt-oss-source-$env:SHA.tar.gz"
          $archivePath = "source-archive\$archiveName"
          git -C dbt-oss archive --format=tar.gz --output="$PWD\$archivePath" HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed" }
          $hash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source archive: $archiveName sha256=$hash"
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "name=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: "dbt-oss -> target"

      - name: Install protoc manually (x86_64 binary runs via emulation)
        shell: pwsh
        run: |
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile protoc.zip
          Expand-Archive -Path protoc.zip -DestinationPath $env:RUNNER_TEMP\protoc -Force
          echo "$env:RUNNER_TEMP\protoc\bin" >> $env:GITHUB_PATH

      - name: Verify protoc is on PATH
        shell: pwsh
        run: protoc --version

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4 # v0.0.6

      - name: Expose GHA cache env vars for sccache
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3

      - name: Start sccache and set wrapper
        shell: pwsh
        run: |
          $env:SCCACHE_GHA_ENABLED = "true"
          & sccache --start-server
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "sccache backend unhealthy - continuing without cache"
            & sccache --stop-server 2>$null
            $global:LASTEXITCODE = 0
          } else {
            echo "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
            echo "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          }

      - name: Confirm wrapper and GHA mode are active
        shell: pwsh
        run: |
          echo "RUSTC_WRAPPER=$env:RUSTC_WRAPPER"
          echo "SCCACHE_GHA_ENABLED=$env:SCCACHE_GHA_ENABLED"

      - name: Install maturin
        shell: pwsh
        run: pip install maturin

      # Builds every requested distribution name into its own dist/<name>/
      # folder, one at a time, so two wheels never sit in the same directory
      # at once - the thing that made the earlier bundle-matching bug
      # possible downstream. pyproject.toml is renamed only for the "dbt-oss"
      # pass and restored immediately after, matching upstream's own
      # release-v2.yml "Rename pyproject for oss wheel" step.
      #
      # The rename/restore uses ReadAllText/WriteAllText (not
      # Get-Content|Set-Content) so no re-splitting/rejoining of lines can
      # drift the file's bytes, and the restore is checked against a SHA256
      # captured before any edit - not just a text-pattern match - so a
      # silent encoding/newline change would be caught by the same
      # clean-tree check this exists to protect.
      - name: Build requested wheel(s) into isolated per-name folders
        working-directory: dbt-oss/crates/dbt-sa-python
        shell: pwsh
        env:
          PACKAGE_TARGETS: ${{ github.event.inputs.package_targets }}
        run: |
          $targets = if ($env:PACKAGE_TARGETS -eq "both") { @("dbt-core","dbt-oss") } else { @($env:PACKAGE_TARGETS) }
          Write-Host "Building: $($targets -join ', ')"

          $pyprojectPath = (Resolve-Path pyproject.toml).Path
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $originalHash = (Get-FileHash $pyprojectPath -Algorithm SHA256).Hash

          foreach ($name in $targets) {
            if ($name -eq "dbt-oss") {
              $raw = [System.IO.File]::ReadAllText($pyprojectPath)
              $renamed = $raw -replace '(?m)^name = "dbt-core"(\r?)$', 'name = "dbt-oss"$1'
              if ($renamed -eq $raw) { throw "rename to dbt-oss did not match any line" }
              [System.IO.File]::WriteAllText($pyprojectPath, $renamed, $utf8NoBom)
            }

            Remove-Item -Recurse -Force ..\..\target\wheels -ErrorAction SilentlyContinue
            maturin build --release --locked
            if ($LASTEXITCODE -ne 0) { throw "maturin build failed for $name" }

            $wheels = @(Get-ChildItem ..\..\target\wheels -Filter "*.whl")
            if ($wheels.Count -ne 1) {
              throw "expected exactly 1 wheel for $name, found $($wheels.Count)"
            }

            $destDir = "..\..\..\dist\$name"
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Move-Item $wheels[0].FullName "$destDir\$($wheels[0].Name)"
            Write-Host "Built $name -> $destDir\$($wheels[0].Name)"

            if ($name -eq "dbt-oss") {
              $raw = [System.IO.File]::ReadAllText($pyprojectPath)
              $restored = $raw -replace '(?m)^name = "dbt-oss"(\r?)$', 'name = "dbt-core"$1'
              if ($restored -eq $raw) { throw "restore to dbt-core did not match any line" }
              [System.IO.File]::WriteAllText($pyprojectPath, $restored, $utf8NoBom)

              $restoredHash = (Get-FileHash $pyprojectPath -Algorithm SHA256).Hash
              if ($restoredHash -ne $originalHash) {
                throw "pyproject.toml restore hash mismatch: got $restoredHash, expected $originalHash"
              }
            }
          }

      - name: Show built wheel(s)
        shell: pwsh
        run: Get-ChildItem -Path dist -Recurse -Filter "*.whl"

      - name: Confirm build did not modify tracked sources, write upstream record
        shell: pwsh
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
          TAG: ${{ github.event.inputs.dbt_oss_tag }}
          POLICY_VERSION: ${{ env.POLICY_VERSION }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          git -C dbt-oss diff --quiet HEAD
          if ($LASTEXITCODE -ne 0) { throw "Build modified tracked source files" }
          $head = git -C dbt-oss rev-parse HEAD
          if ($head -ne $env:SHA) { throw "HEAD $head != expected $env:SHA" }
          @{
            upstream_repo           = "https://github.com/dbt-labs/dbt-oss"
            upstream_tag            = $env:TAG
            upstream_commit         = $head
            tree_clean              = $true
            policy_version          = $env:POLICY_VERSION
            snapshot_archive_name   = $env:ARCHIVE_NAME
            snapshot_archive_sha256 = $env:ARCHIVE_SHA256
          } | ConvertTo-Json | Set-Content -Path upstream-source.json
          Get-Content upstream-source.json

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbt-wheels-win-arm64
          path: dist/**/*.whl
          if-no-files-found: error

      - name: Upload source archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbt-source-archive
          path: source-archive/*.tar.gz
          if-no-files-found: error

      # Each dist/<name>/ folder holds exactly one wheel, so these are
      # attested individually - one single-subject attestation per wheel,
      # instead of one glob covering both (which GitHub Actions treats as
      # a single multi-subject attestation, not two separate ones).
      - name: Attest build provenance (dbt-core)
        if: hashFiles('dist/dbt-core/*.whl') != ''
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/dbt-core/*.whl

      - name: Attest upstream source (dbt-core)
        if: hashFiles('dist/dbt-core/*.whl') != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/dbt-core/*.whl
          predicate-type: ${{ env.UPSTREAM_PREDICATE }}
          predicate-path: upstream-source.json

      - name: Attest build provenance (dbt-oss)
        if: hashFiles('dist/dbt-oss/*.whl') != ''
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/dbt-oss/*.whl

      - name: Attest upstream source (dbt-oss)
        if: hashFiles('dist/dbt-oss/*.whl') != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/dbt-oss/*.whl
          predicate-type: ${{ env.UPSTREAM_PREDICATE }}
          predicate-path: upstream-source.json

      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
      actions: read # needed to fetch the build job's log via the Actions API
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.dbt_oss_tag }}
      SHA: ${{ needs.build.outputs.upstream_sha }}
      UPSTREAM_PREDICATE: https://patrickryankenneth.github.io/attestations/upstream-source/v1
      # [host/]<owner>/<repo>/<path>/<to>/<workflow> - narrows verification
      # from "attested by GitHub" to "attested by this exact workflow".
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/build-dbt-oss-win-arm64.yml
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dbt-wheels-win-arm64
          path: dist

      - name: List downloaded wheels
        run: find dist -name '*.whl'

      - name: Download source archive artifact into release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dbt-source-archive
          path: release-assets

      # GitHub Actions logs are only retained ~90 days by default. Fetching
      # the build job's log here works because this job only starts once
      # `needs: build` has finished - the log is already complete and
      # fetchable via the API, not something being read mid-run. Landing it
      # in release-assets/ now means it's picked up automatically by the
      # draft-upload-verify-publish step below, same as the wheels and
      # attestation bundles: no release goes public without it attached.
      - name: Fetch build job log
        run: |
          set -euo pipefail
          mkdir -p release-assets
          job_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name=="build") | .id')
          if [ -z "$job_id" ]; then
            echo "::error::could not find the build job's id in this run"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" --allow-escape-sequences > build-log.txt
          gzip -9 build-log.txt
          mv build-log.txt.gz "release-assets/build-log-${TAG}.txt.gz"
          echo "Saved build log for job $job_id"

      # Fixes the earlier bug: instead of globbing for "any file starting
      # with sha256" after the fact (which can grab a leftover from a prior
      # iteration), this parses the exact filename gh attestation download
      # reports for THIS wheel, in THIS iteration, and renames only that.
      - name: Verify attestations and save bundles
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -name '*.whl' -print0 | while IFS= read -r -d '' wheel; do
            base=$(basename "$wheel")
            echo "== $base =="
            cp "$wheel" "release-assets/$base"

            gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW"
            gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY" \
              --predicate-type "$UPSTREAM_PREDICATE" \
              --signer-workflow "$SIGNER_WORKFLOW"

            # gh attestation download always names its output after the
            # artifact's digest (sha256:<hex>.jsonl) - no --output flag
            # exists. We compute that digest ourselves rather than parsing
            # it back out of the CLI's human-readable text, so there's
            # nothing to regex-match and nothing that can grab the wrong
            # file if the CLI's output formatting ever changes.
            digest="sha256:$(sha256sum "$wheel" | cut -d' ' -f1)"
            gh attestation download "$wheel" --repo "$GITHUB_REPOSITORY" >/dev/null

            bundle="${digest}.jsonl"
            if [ ! -f "$bundle" ]; then
              echo "::error::expected attestation bundle $bundle not found for $base"
              exit 1
            fi
            mv "$bundle" "release-assets/$base.attestations.jsonl"
          done
          echo "== release-assets =="
          ls -la release-assets

      - name: Sanity-check bundles are actually distinct
        run: |
          cd release-assets
          n_wheels=$(ls -1 *.whl | wc -l)
          n_unique_bundles=$(sha256sum *.attestations.jsonl | awk '{print $1}' | sort -u | wc -l)
          echo "wheels: $n_wheels, unique bundle hashes: $n_unique_bundles"
          if [ "$n_wheels" -gt 1 ] && [ "$n_unique_bundles" -lt "$n_wheels" ]; then
            echo "::error::attestation bundles are not unique per wheel - refusing to publish"
            exit 1
          fi

      # Transactional at the public-release boundary: build -> attest ->
      # verify -> create draft -> upload everything -> verify everything ->
      # publish. Nothing public exists until every asset is confirmed
      # present. A published release is then immutable: a rerun of the same
      # tag is only allowed if it would produce the exact same asset set (a
      # genuine no-op); anything else fails loudly instead of quietly
      # swapping a binary someone may already have verified and pinned. A
      # leftover *draft* from a run that died mid-upload is not yet public,
      # so it's safe to resume and clobber within.
      - name: Create draft, upload, verify, then publish
        run: |
          set -euo pipefail
          REL="dbt-oss-${TAG}"
          expected=$(cd release-assets && ls -1 | sort)

          if gh release view "$REL" --repo "$GITHUB_REPOSITORY" \
               --json isDraft,assets > /tmp/rel.json 2>/dev/null; then
            isDraft=$(jq -r '.isDraft' /tmp/rel.json)
            existing=$(jq -r '.assets[].name' /tmp/rel.json | sort)

            if [ "$isDraft" = "false" ]; then
              if [ "$existing" = "$expected" ]; then
                echo "Release $REL is already published with these exact assets - nothing to do"
                exit 0
              fi
              echo "::error::Published release $REL already exists with a different asset set - refusing to overwrite"
              echo "existing:"; echo "$existing"
              echo "expected:"; echo "$expected"
              exit 1
            fi

            echo "Resuming incomplete draft release $REL (not yet public)"
          else
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" --draft \
              --title "dbt-oss ${TAG}" \
              --notes "Built from dbt-labs/dbt-oss@${SHA} (tag ${TAG}), unmodified. Verify with: gh attestation verify <wheel> --repo ${GITHUB_REPOSITORY} --signer-workflow ${SIGNER_WORKFLOW}"
          fi

          # --clobber is safe here: the release is still a draft, so nothing
          # public is being overwritten - this is only ever resuming or
          # completing an upload that hasn't been shown to anyone yet.
          gh release upload "$REL" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*

          final=$(gh release view "$REL" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          if [ "$final" != "$expected" ]; then
            echo "::error::Uploaded asset set does not match expected set - not publishing"
            echo "uploaded:"; echo "$final"
            echo "expected:"; echo "$expected"
            exit 1
          fi

          gh release edit "$REL" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published $REL"
