  name: build-dbt-oss-win-arm64
  
  on:
    workflow_dispatch:
      inputs:
        dbt_oss_tag:
          description: 'Git tag in dbt-labs/dbt-oss to build (e.g. v2.0.5)'
          required: true
          default: 'v2.0.5'
        package_targets:
          description: 'Which distribution name(s) to build and publish'
          required: true
          default: 'both'
          type: choice
          options:
            - both
            - dbt-core
            - dbt-oss
  
  permissions:
    contents: read
    id-token: write
    attestations: write
  
  env:
    UPSTREAM_PREDICATE: https://patrickryankenneth.github.io/attestations/upstream-source/v1
  
  jobs:
    build:
      runs-on: windows-11-arm
      timeout-minutes: 360
      env:
        RUSTFLAGS: "--cap-lints=warn"
      outputs:
        upstream_sha: ${{ steps.upstream.outputs.sha }}
      steps:
        - name: Resolve upstream tag to commit
          id: upstream
          shell: pwsh
          env:
            TAG: ${{ github.event.inputs.dbt_oss_tag }}
          run: |
            $url = "https://github.com/dbt-labs/dbt-oss.git"
            $tag = $env:TAG
            $line = git ls-remote $url "refs/tags/${tag}^{}"
            if (-not $line) { $line = git ls-remote $url "refs/tags/${tag}" }
            if (-not $line) { throw "Tag $tag not found in $url" }
            $sha = ($line | Select-Object -First 1).Split("`t")[0]
            echo "Tag $tag resolves to $sha"
            "sha=$sha" >> $env:GITHUB_OUTPUT
  
        - name: Checkout dbt-oss at resolved commit
          uses: actions/checkout@v4
          with:
            repository: dbt-labs/dbt-oss
            ref: ${{ steps.upstream.outputs.sha }}
            path: dbt-oss
  
        - name: Verify checkout is exact and unmodified
          shell: pwsh
          env:
            SHA: ${{ steps.upstream.outputs.sha }}
          run: |
            $head = git -C dbt-oss rev-parse HEAD
            if ($head -ne $env:SHA) { throw "HEAD $head != expected $env:SHA" }
            if (git -C dbt-oss status --porcelain) { throw "Working tree is not clean" }
            echo "Checkout verified: $head"
  
        - name: Install Rust
          uses: actions-rust-lang/setup-rust-toolchain@v1
          with:
            cache-workspaces: "dbt-oss -> target"
  
        - name: Install protoc manually (x86_64 binary runs via emulation)
          shell: pwsh
          run: |
            $url = "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip"
            Invoke-WebRequest -Uri $url -OutFile protoc.zip
            Expand-Archive -Path protoc.zip -DestinationPath $env:RUNNER_TEMP\protoc -Force
            echo "$env:RUNNER_TEMP\protoc\bin" >> $env:GITHUB_PATH
  
        - name: Verify protoc is on PATH
          shell: pwsh
          run: protoc --version
  
        - name: Install sccache
          uses: mozilla-actions/sccache-action@v0.0.6
  
        - name: Expose GHA cache env vars for sccache
          uses: crazy-max/ghaction-github-runtime@v3
  
        - name: Start sccache and set wrapper
          shell: pwsh
          run: |
            $env:SCCACHE_GHA_ENABLED = "true"
            & sccache --start-server
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "sccache backend unhealthy - continuing without cache"
              & sccache --stop-server 2>$null
              $global:LASTEXITCODE = 0
            } else {
              echo "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
              echo "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
            }
  
        - name: Confirm wrapper and GHA mode are active
          shell: pwsh
          run: |
            echo "RUSTC_WRAPPER=$env:RUSTC_WRAPPER"
            echo "SCCACHE_GHA_ENABLED=$env:SCCACHE_GHA_ENABLED"
  
        - name: Install maturin
          shell: pwsh
          run: pip install maturin
  
        # Builds every requested distribution name into its own dist/<name>/
        # folder, one at a time, so two wheels never sit in the same directory
        # at once - the thing that made the earlier bundle-matching bug
        # possible downstream. pyproject.toml is renamed only for the "dbt-oss"
        # pass and restored immediately after, matching upstream's own
        # release-v2.yml "Rename pyproject for oss wheel" step.
        - name: Build requested wheel(s) into isolated per-name folders
          working-directory: dbt-oss/crates/dbt-sa-python
          shell: pwsh
          env:
            PACKAGE_TARGETS: ${{ github.event.inputs.package_targets }}
          run: |
            $targets = if ($env:PACKAGE_TARGETS -eq "both") { @("dbt-core","dbt-oss") } else { @($env:PACKAGE_TARGETS) }
            Write-Host "Building: $($targets -join ', ')"
  
            foreach ($name in $targets) {
              if ($name -eq "dbt-oss") {
                (Get-Content pyproject.toml) -replace '^name = "dbt-core"$', 'name = "dbt-oss"' |
                  Set-Content pyproject.toml
                if (-not (Select-String -Path pyproject.toml -Pattern '^name = "dbt-oss"$')) {
                  throw "rename to dbt-oss did not land"
                }
              }
  
              Remove-Item -Recurse -Force ..\..\target\wheels -ErrorAction SilentlyContinue
              maturin build --release
              if ($LASTEXITCODE -ne 0) { throw "maturin build failed for $name" }
  
              $wheels = @(Get-ChildItem ..\..\target\wheels -Filter "*.whl")
              if ($wheels.Count -ne 1) {
                throw "expected exactly 1 wheel for $name, found $($wheels.Count)"
              }
  
              $destDir = "..\..\..\dist\$name"
              New-Item -ItemType Directory -Force -Path $destDir | Out-Null
              Move-Item $wheels[0].FullName "$destDir\$($wheels[0].Name)"
              Write-Host "Built $name -> $destDir\$($wheels[0].Name)"
  
              if ($name -eq "dbt-oss") {
                (Get-Content pyproject.toml) -replace '^name = "dbt-oss"$', 'name = "dbt-core"' |
                  Set-Content pyproject.toml
                if (-not (Select-String -Path pyproject.toml -Pattern '^name = "dbt-core"$')) {
                  throw "restore to dbt-core did not land"
                }
              }
            }
  
        - name: Show built wheel(s)
          shell: pwsh
          run: Get-ChildItem -Path dist -Recurse -Filter "*.whl"
  
        - name: Confirm build did not modify tracked sources, write upstream record
          shell: pwsh
          env:
            SHA: ${{ steps.upstream.outputs.sha }}
            TAG: ${{ github.event.inputs.dbt_oss_tag }}
          run: |
            git -C dbt-oss diff --quiet HEAD
            if ($LASTEXITCODE -ne 0) { throw "Build modified tracked source files" }
            $head = git -C dbt-oss rev-parse HEAD
            if ($head -ne $env:SHA) { throw "HEAD $head != expected $env:SHA" }
            @{
              upstream_repo   = "https://github.com/dbt-labs/dbt-oss"
              upstream_tag    = $env:TAG
              upstream_commit = $head
              tree_clean      = $true
            } | ConvertTo-Json | Set-Content -Path upstream-source.json
            Get-Content upstream-source.json
  
        - name: Upload wheel artifacts
          uses: actions/upload-artifact@v4
          with:
            name: dbt-wheels-win-arm64
            path: dist/**/*.whl
            if-no-files-found: error
  
        # Given a multi-file glob, this attests EACH matched file separately
        # with its own correctly-scoped digest - one attestation per wheel,
        # never mixed up. This part was never the source of the earlier bug.
        - name: Attest build provenance (dbt-core)
        if: hashFiles('dist/dbt-core/*.whl') != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/dbt-core/*.whl

        - name: Attest upstream source (dbt-core)
        if: hashFiles('dist/dbt-core/*.whl') != ''
        uses: actions/attest@v4
        with:
          subject-path: dist/dbt-core/*.whl
          predicate-type: ${{ env.UPSTREAM_PREDICATE }}
          predicate-path: upstream-source.json

        - name: Attest build provenance (dbt-oss)
        if: hashFiles('dist/dbt-oss/*.whl') != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/dbt-oss/*.whl

        - name: Attest upstream source (dbt-oss)
        if: hashFiles('dist/dbt-oss/*.whl') != ''
        uses: actions/attest@v4
        with:
          subject-path: dist/dbt-oss/*.whl
          predicate-type: ${{ env.UPSTREAM_PREDICATE }}
          predicate-path: upstream-source.json



        - name: sccache stats
          if: always()
          shell: pwsh
          run: sccache --show-stats
  
    release:
      needs: build
      runs-on: ubuntu-latest
      permissions:
        contents: write
        attestations: read
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.inputs.dbt_oss_tag }}
        SHA: ${{ needs.build.outputs.upstream_sha }}
        UPSTREAM_PREDICATE: https://patrickryankenneth.github.io/attestations/upstream-source/v1
      steps:
        - name: Download wheel artifacts
          uses: actions/download-artifact@v4
          with:
            name: dbt-wheels-win-arm64
            path: dist
  
        - name: List downloaded wheels
          run: find dist -name '*.whl'
  
        # Fixes the earlier bug: instead of globbing for "any file starting
        # with sha256" after the fact (which can grab a leftover from a prior
        # iteration), this parses the exact filename gh attestation download
        # reports for THIS wheel, in THIS iteration, and renames only that.
        - name: Verify attestations and save bundles
          run: |
            set -euo pipefail
            mkdir -p release-assets
            find dist -name '*.whl' -print0 | while IFS= read -r -d '' wheel; do
              base=$(basename "$wheel")
              echo "== $base =="
              cp "$wheel" "release-assets/$base"
  
              gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY"
              gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY" \
                --predicate-type "$UPSTREAM_PREDICATE"
  
              out=$(gh attestation download "$wheel" --repo "$GITHUB_REPOSITORY")
              echo "$out"
              bundle=$(echo "$out" | grep -oE 'sha256:[0-9a-f]+\.jsonl' | head -n1)
              if [ -z "$bundle" ] || [ ! -f "$bundle" ]; then
                echo "::error::could not locate attestation bundle for $base"
                exit 1
              fi
              mv "$bundle" "release-assets/$base.attestations.jsonl"
            done
            echo "== release-assets =="
            ls -la release-assets
  
        - name: Sanity-check bundles are actually distinct
          run: |
            cd release-assets
            n_wheels=$(ls -1 *.whl | wc -l)
            n_unique_bundles=$(sha256sum *.attestations.jsonl | awk '{print $1}' | sort -u | wc -l)
            echo "wheels: $n_wheels, unique bundle hashes: $n_unique_bundles"
            if [ "$n_wheels" -gt 1 ] && [ "$n_unique_bundles" -lt "$n_wheels" ]; then
              echo "::error::attestation bundles are not unique per wheel - refusing to publish"
              exit 1
            fi
  
        - name: Create or update GitHub Release
          run: |
            REL="dbt-oss-${TAG}"
            if ! gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$REL" --repo "$GITHUB_REPOSITORY" \
                --title "dbt-oss ${TAG}" \
                --notes "Built from dbt-labs/dbt-oss@${SHA} (tag ${TAG}), unmodified. Verify with: gh attestation verify <wheel> --repo ${GITHUB_REPOSITORY}"
            fi
            gh release upload "$REL" --repo "$GITHUB_REPOSITORY" --clobber \
              release-assets/*
  
