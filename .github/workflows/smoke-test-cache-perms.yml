name: smoke-test-cache-perms

# Isolates the fix for build-dbt-oss-musllinux.yml's cache-save failure:
# docker writes into ~/pywheels-cache/* as root, then a second, short
# container (also root - needed, since only root can chown files it
# doesn't own) chowns those bind-mounted host paths back to the runner
# user before actions/cache tries to read them.
#
# Earlier version of this fix tried `docker run --user "$(id -u):$(id
# -g)"` on the build container itself. That broke the build instead:
# RUSTUP_HOME=/opt/rustup and CARGO_HOME=/opt/cargo are root-owned inside
# the image (rustup/cargo were installed as root when the image was
# built), so forcing the whole container to run as the host UID made
# rustup unable to write its own temp files. This version leaves the
# build container as root and only touches the host-visible bind mounts,
# in a separate step, after the fact.
#
# Pulls the existing pywheels-alpine-builder image instead of building
# it, so this finishes in well under a minute.

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pywheels-alpine-builder

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull builder image
        run: docker pull "${IMAGE}:latest"

      - name: Prepare cache dirs
        run: |
          mkdir -p ~/pywheels-cache/cargo-registry \
                   ~/pywheels-cache/cargo-git \
                   ~/pywheels-cache/cargo-target \
                   ~/pywheels-cache/sccache

      - name: Write probe files as root (as the real build container does)
        run: |
          docker run --rm \
            -v ~/pywheels-cache/cargo-registry:/opt/cargo/registry \
            -v ~/pywheels-cache/cargo-git:/opt/cargo/git \
            -v ~/pywheels-cache/cargo-target:/cargo-target \
            -v ~/pywheels-cache/sccache:/sccache \
            "${IMAGE}:latest" \
            sh -c '
              id
              echo probe > /opt/cargo/registry/probe.txt
              echo probe > /opt/cargo/git/probe.txt
              echo probe > /cargo-target/probe.txt
              echo probe > /sccache/probe.txt
            '

      - name: Confirm probe files are currently root-owned (sanity check)
        run: |
          stat -c '%U %n' ~/pywheels-cache/cargo-registry/probe.txt

      - name: Fix ownership (the actual fix)
        run: |
          docker run --rm \
            -v ~/pywheels-cache/cargo-registry:/opt/cargo/registry \
            -v ~/pywheels-cache/cargo-git:/opt/cargo/git \
            -v ~/pywheels-cache/cargo-target:/cargo-target \
            -v ~/pywheels-cache/sccache:/sccache \
            "${IMAGE}:latest" \
            chown -R "$(id -u):$(id -g)" /opt/cargo/registry /opt/cargo/git /cargo-target /sccache

      - name: Verify probe files are now owned by the runner user
        run: |
          runner_uid="$(id -u)"
          fail=0
          for f in \
            ~/pywheels-cache/cargo-registry/probe.txt \
            ~/pywheels-cache/cargo-git/probe.txt \
            ~/pywheels-cache/cargo-target/probe.txt \
            ~/pywheels-cache/sccache/probe.txt
          do
            owner_uid="$(stat -c '%u' "$f")"
            echo "$f owned by uid $owner_uid (runner is $runner_uid)"
            if [ "$owner_uid" != "$runner_uid" ]; then
              echo "::error::$f is still root-owned - the chown fix isn't working"
              fail=1
            fi
          done
          exit $fail

      # This is the exact step that failed with "Cannot open: Permission
      # denied" in the real run. If the chown above worked, this succeeds.
      - name: Cache save round trip (the step that failed before)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/pywheels-cache/cargo-registry
            ~/pywheels-cache/cargo-git
            ~/pywheels-cache/cargo-target
            ~/pywheels-cache/sccache
          key: smoke-cache-perms-${{ github.run_id }}
